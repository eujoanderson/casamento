<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3eee3" />
  <meta name="description" content="Convite de casamento" />
  <title>Convite de Casamento</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #ede7da;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Georgia, 'Times New Roman', serif;
      overflow-x: hidden;
    }

    .page {
      width: min(100%, 720px);
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: #f5f0e5;
      box-shadow: 0 24px 70px rgba(34, 42, 21, 0.18);
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: -30px;
      background: url('convite.jpeg') center / cover no-repeat;
      filter: blur(28px) saturate(.85);
      opacity: .22;
      z-index: -2;
      transform: scale(1.08);
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,.05), rgba(255,255,255,.02));
      pointer-events: none;
      z-index: 2;
    }

    .invite-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 760px) {
      body {
        display: block;
        padding: 0;
        background: #f5f0e5;
      }

      .page {
        width: 100%;
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }

      .invite-image {
        width: 100%;
        min-height: 100dvh;
        object-fit: cover;
        object-position: top center;
      }
    }

    @media (max-width: 460px) {
      .invite-image {
        min-height: auto;
        object-fit: contain;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Convite de casamento">
    <img
      class="invite-image"
      src="convite.jpeg"
      alt="Convite de casamento"
      width="1024"
      height="1536"
      loading="eager"
      decoding="async"
    />
  </main>
</body>
</html>
