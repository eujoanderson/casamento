    .invite {
      position: relative;
      z-index: 1;
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      object-fit: contain;

      opacity: 0;
      transform: scale(0.96) translateY(12px);
      filter: blur(5px);
      transition:
        opacity 1.15s ease,
        transform 1.15s cubic-bezier(.2,.8,.2,1),
        filter 1.15s ease;
      will-change: opacity, transform, filter;
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
    }

    body.loaded .invite {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }

    body.loaded .background {
      opacity: 0.34;
    }

    /* Em telas pequenas, mantém o convite inteiro visível */
    @media (max-width: 768px) {
      .invite {
        max-width: 100vw;
        max-height: 100dvh;
        box-shadow: none;
      }

      .background {
        opacity: 0;
      }

      body.loaded .background {
        opacity: 0.20;
      }
    }

    /* Respeita usuários que preferem menos animação */
    @media (prefers-reduced-motion: reduce) {
      .invite,
      .background {
        transition: none;
      }

      .invite {
        opacity: 1;
        transform: none;
        filter: none;
      }

      .background {
        opacity: 0.25;
      }
    }
  </style>
