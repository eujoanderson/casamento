<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#1f2918" />

  <title>Convite de Casamento</title>

  <style>
    :root {
      --imagem-convite: url("convite.jpeg");
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      background: #1f2918;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ===========================
       FUNDO DESFOCADO
       =========================== */

    .fundo {
      position: fixed;

      inset: -40px;

      z-index: -2;

      background-image:
        linear-gradient(
          rgba(20, 28, 16, 0.18),
          rgba(20, 28, 16, 0.18)
        ),
        var(--imagem-convite);

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;

      filter: blur(28px);

      transform: scale(1.12);
    }

    .fundo::after {
      content: "";

      position: absolute;

      inset: 0;

      background: rgba(0, 0, 0, 0.08);
    }

    /* ===========================
       CONTEÚDO PRINCIPAL
       =========================== */

    main {
      width: 100%;

      min-height: 100dvh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 0;
    }

    /* ===========================
       IMAGEM DO CONVITE
       =========================== */

    .convite {
      display: block;

      width: auto;

      max-width: 100vw;

      height: auto;

      max-height: 100dvh;

      object-fit: contain;

      border: none;

      outline: none;

      border-radius: 0;

      box-shadow: none;

      user-select: none;

      -webkit-user-drag: none;
    }

    /* ===========================
       CELULAR
       =========================== */

    @media (max-width: 768px) {

      main {
        min-height: 100dvh;

        align-items: flex-start;
      }

      .convite {
        width: 100vw;

        max-width: none;

        height: auto;

        max-height: none;

        object-fit: cover;
      }
    }

    /* ===========================
       CELULAR EM PAISAGEM
       =========================== */

    @media (max-width: 950px) and (orientation: landscape) {

      main {
        align-items: center;
      }

      .convite {
        width: auto;

        max-width: 100vw;

        height: 100dvh;

        max-height: 100dvh;

        object-fit: contain;
      }
    }

    /* ===========================
       COMPUTADOR / NOTEBOOK
       =========================== */

    @media (min-width: 769px) {

      .convite {
        height: 100dvh;

        width: auto;
      }
    }

  </style>
</head>

<body>

  <!-- Fundo desfocado -->
  <div
    class="fundo"
    aria-hidden="true">
  </div>


  <!-- Convite -->
  <main>

    <img
      class="convite"
      src="convite.jpeg"
      alt="Convite de casamento"
      draggable="false"
    />

  </main>

</body>
</html>
