<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2a17" />
  <title>John & Laura — Casamento</title>
  <meta name="description" content="Convite de casamento — John & Laura, 03 de outubro de 2026." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root{
      --green:#26351d;
      --cream:#f6f1e5;
      --paper:#fffdf8;
      --line:rgba(38,53,29,.22);
      --shadow:0 20px 70px rgba(25,31,20,.18);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:"Cormorant Garamond", Georgia, serif;
      color:var(--green);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 35%),
        linear-gradient(180deg,#efe7d6,#f8f3e8 45%,#ebe2cd);
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 35%,rgba(255,255,255,.08));
      z-index:10;
    }

    .page{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:clamp(14px,3vw,36px);
    }

    .invite{
      width:min(100%, 820px);
      background:var(--paper);
      border:1px solid rgba(38,53,29,.08);
      border-radius:30px;
      overflow:hidden;
      box-shadow:var(--shadow);
      opacity:0;
      transform:translateY(30px) scale(.985);
      animation:cardIn 1.1s cubic-bezier(.2,.8,.2,1) .12s forwards;
    }

    .visual{
      position:relative;
      background:#dcd4c3;
      overflow:hidden;
      isolation:isolate;
    }

    .visual img{
      display:block;
      width:100%;
      height:auto;
      transform:scale(1.045);
      filter:saturate(.92) contrast(.98) brightness(1.01);
      animation:imageIn 1.8s cubic-bezier(.2,.8,.2,1) .2s forwards;
    }

    .visual::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 65%,rgba(26,35,20,.12));
      pointer-events:none;
      z-index:1;
    }

    .shine{
      position:absolute;
      inset:-40%;
      background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.23) 50%,transparent 60%);
      transform:translateX(-50%) rotate(6deg);
      animation:shine 6s ease-in-out 1.5s infinite;
      z-index:2;
      pointer-events:none;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      padding:22px 18px 24px;
      background:linear-gradient(180deg,#fffdf8,#f7f1e5);
      border-top:1px solid var(--line);
    }

    .btn{
      appearance:none;
      border:1px solid rgba(38,53,29,.22);
      color:var(--green);
      background:rgba(255,255,255,.65);
      padding:12px 18px;
      border-radius:999px;
      text-decoration:none;
      font-size:1.02rem;
      font-weight:600;
      letter-spacing:.02em;
      transition:transform .25s ease, background .25s ease, box-shadow .25s ease;
      backdrop-filter:blur(8px);
    }

    .btn:hover{
      transform:translateY(-3px);
      background:#fff;
      box-shadow:0 12px 26px rgba(38,53,29,.13);
    }

    .btn.primary{
      background:var(--green);
      color:#fffdf8;
      border-color:var(--green);
    }

    .hint{
      text-align:center;
      margin:0;
      padding:0 18px 22px;
      font-size:.95rem;
      opacity:.72;
      background:#f7f1e5;
    }

    @keyframes cardIn{
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    @keyframes imageIn{
      to{transform:scale(1)}
    }
    @keyframes shine{
      0%,68%{transform:translateX(-65%) rotate(6deg);opacity:0}
      75%{opacity:1}
      90%,100%{transform:translateX(65%) rotate(6deg);opacity:0}
    }

    @media (max-width:640px){
      .page{padding:0;background:#f6f1e5;align-items:start}
      .invite{width:100%;border-radius:0;border:0;box-shadow:none;min-height:100svh}
      .visual img{min-height:auto}
      .actions{padding:18px 14px 16px;position:relative;z-index:3}
      .btn{flex:1 1 150px;text-align:center}
      .hint{padding-bottom:24px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="invite" aria-label="Convite de casamento de John e Laura">
      <div class="visual">
        <img src="assets/convite.jpeg" alt="Convite de casamento de John e Laura, dia 03 de outubro de 2026, às 10h, na Fazenda Real, João Pessoa - PB." />
        <div class="shine" aria-hidden="true"></div>
      </div>

      <div class="actions">
        <a class="btn primary" href="https://www.google.com/maps/search/?api=1&query=Fazenda+Real+Joao+Pessoa+PB" target="_blank" rel="noopener">Ver localização</a>
        <button class="btn" type="button" id="shareBtn">Compartilhar convite</button>
      </div>
      <p class="hint">03 de outubro de 2026 • 10h • Fazenda Real — João Pessoa/PB</p>
    </section>
  </main>

  <script>
    const shareBtn = document.getElementById('shareBtn');
    shareBtn.addEventListener('click', async () => {
      const data = {
        title: 'Casamento John & Laura',
        text: 'Você está convidado para o nosso casamento! 03/10/2026 às 10h — Fazenda Real, João Pessoa/PB.',
        url: window.location.href
      };

      if (navigator.share) {
        try { await navigator.share(data); } catch (_) {}
      } else {
        await navigator.clipboard.writeText(window.location.href);
        const original = shareBtn.textContent;
        shareBtn.textContent = 'Link copiado ✓';
        setTimeout(() => shareBtn.textContent = original, 1800);
      }
    });

    // Pequeno efeito de profundidade no desktop, sem atrapalhar o mobile.
    if (window.matchMedia('(pointer:fine)').matches) {
      const card = document.querySelector('.invite');
      const img = document.querySelector('.visual img');
      card.addEventListener('mousemove', (e) => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - .5;
        const y = (e.clientY - r.top) / r.height - .5;
        img.style.transform = `scale(1.012) translate(${x * 4}px, ${y * 4}px)`;
      });
      card.addEventListener('mouseleave', () => {
        img.style.transform = 'scale(1) translate(0,0)';
      });
    }
  </script>
</body>
</html>
