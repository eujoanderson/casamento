  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f1eb;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    .convite {
      position: relative;
      width: min(100vw, 900px);
      height: min(100vh, 900px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .convite img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform .6s ease, filter .6s ease;
    }

    .convite:hover img {
      transform: scale(1.015);
      filter: brightness(1.02);
    }

    .abrir {
      position: absolute;
      left: 50%;
      bottom: 7%;
      transform: translateX(-50%);
      padding: 11px 22px;
      border: 1px solid rgba(92, 101, 74, .35);
      border-radius: 999px;
      background: rgba(255, 253, 249, .88);
      color: #596247;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      backdrop-filter: blur(5px);
      transition: .3s ease;
      pointer-events: none;
    }

    .convite:hover .abrir {
      background: rgba(255, 253, 249, .97);
      transform: translateX(-50%) translateY(-3px);
    }

    @media (max-width: 600px) {
      body {
        background: #f5f1eb;
      }

      .convite {
        width: 100vw;
        height: 100vh;
      }

      .convite img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .abrir {
        bottom: 5%;
        font-size: 11px;
        padding: 10px 17px;
        letter-spacing: 1.5px;
      }
    }
  </style>
